services:
  db:
    image: postgres:17
    container_name: pulso_db
    environment:
      POSTGRES_USER: pulso_user
      POSTGRES_PASSWORD: pulso_password
      POSTGRES_DB: pulso_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pulso_redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./.docker/Dockerfile.back.dev
    container_name: pulso_api
    env_file:
      - ./backend/pulso/.env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend/pulso:/app         
      - maven-repo:/root/.m2          
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: ./.docker/Dockerfile.front.dev
    container_name: app_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/pulso:/app      
      - /app/node_modules             

volumes:
  db_data:
  maven-repo:
  redis_data:
