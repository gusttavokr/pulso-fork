name: CI/CD - Build, Push & Deploy Front/Back

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'nginx/**'
      - '.docker/**'
      - '.github/workflows/**'
      - 'docker-compose-prod.yml'
      - 'k8s/**'

jobs:
  build-backend:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.api.prod
          push: false
          tags: pulsoifrn/pulso-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/pulso-api.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulso-api-image
          path: /tmp/pulso-api.tar

  build-frontend:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .docker/Dockerfile.web.prod
        push: false
        tags: pulsoifrn/pulso-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/pulso-web.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: pulso-web-image
        path: /tmp/pulso-web.tar

  push-backend:
    name: Push Backend Image
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pulso-api-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/pulso-api.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push pulsoifrn/pulso-backend:latest

  push-frontend:
    name: Push Frontend Image
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pulso-web-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/pulso-web.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push pulsoifrn/pulso-frontend:latest

  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs:
      - push-backend
      - push-frontend
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Create deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            sudo mkdir -p /home/ubuntu/pulso/nginx
            sudo chown -R ubuntu:ubuntu /home/ubuntu/pulso

            ls -ld /home/ubuntu/pulso
            ls -ld /home/ubuntu/pulso/nginx

      - name: Test SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            hostname
            pwd
  
      - name: Copy docker-compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          source: "docker-compose-prod.yml"
          target: "/home/ubuntu/pulso/"

      - name: Copy nginx config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          source: "nginx"
          target: "/home/ubuntu/pulso/"
  
      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_FRONTEND }}
          script: |
            set -e
          
            cd /home/ubuntu/pulso

            ls -la
            
            docker pull pulsoifrn/pulso-backend:latest
            docker pull pulsoifrn/pulso-frontend:latest
            
            docker compose -f docker-compose-prod.yml up -d --pull never --force-recreate
            
            docker image prune -f
            
            docker ps -a
