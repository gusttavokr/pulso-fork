<form [formGroup]="loginForm" (ngSubmit)="logar()" class="flex flex-col gap-5">

    <!-- Matrícula -->
    <div class="flex flex-col gap-1.5">
        <div class="flex items-center gap-2.5">
            <label class="font-light text-[#020035] text-[18px]">E-mail</label>
        </div>
        <input name="email" formControlName="email" placeholder="Digite seu e-mail" class="w-full h-11.25 mt-1 px-3 py-2 
                    bg-white
                    border-2 border-[#DFE4EA]  
                    rounded-[7px] outline-none 
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                    text-gray-900 
                    placeholder:font-light text-[14px] 
                    placeholder:text-[#A3A3A3]" />

    </div>
    <!-- Senha -->
    <div class="flex flex-col gap-1.5">
        <div class="flex items-center gap-2.5">
            <label class="font-light text-[#020035] text-[18px]">Senha</label>
        </div>

        <!-- AGRUPAMENTO PARA O OLHO FUNCIONAR -->
        <div class="relative w-full">
            <input [type]="mostrarSenha ? 'text' : 'password'" formControlName="senha" placeholder="Digite sua senha"
                class="w-full h-11.25 mt-1 px-3 pr-12 py-2 
                    bg-white
                    border-2 border-[#DFE4EA]  
                    rounded-[7px] outline-none 
                    focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                    text-gray-900 
                    placeholder:font-light text-[14px] 
                    placeholder:text-[#A3A3A3]" />

            <!-- Ícone do olho -->
            <span class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500 w-6 h-6"
                (click)="toggleSenha()">

                @if (!mostrarSenha) {
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <rect width="256" height="256" fill="none" />
                        <path d="M128,56C48,56,16,128,16,128s32,72,112,72,112-72,112-72S208,56,128,56Z" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
                        <circle cx="128" cy="128" r="40" fill="none" stroke="currentColor" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="16" />
                    </svg>
                } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <rect width="256" height="256" fill="none" />
                        <path d="M128,56C48,56,16,128,16,128s32,72,112,72,112-72,112-72S208,56,128,56Z" fill="none"
                            stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" />
                        <circle cx="128" cy="128" r="40" fill="none" stroke="currentColor" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="16" />
                        <line x1="40" y1="40" x2="216" y2="216" stroke="currentColor" stroke-width="16"
                            stroke-linecap="round" />
                    </svg>
                }

            </span>
        </div>
    </div>


    <div class="space-y-3">
        <div class="flex justify-between items-center w-full">
            <a routerLink="/cadastro"
                class="text-[#8C8C8C] hover:text-[#2D69FF] hover:underline text-sm cursor-pointer">
                Não possuo uma conta
            </a>

            <a href="#" class="text-[#8C8C8C] hover:text-[#2D69FF] hover:underline text-sm">
                Esqueci a senha
            </a>

        </div>
    </div>


    @if (erroLogin) {
        <div class="text-red-600 text-sm font-medium text-center">
            {{ erroLogin }}
        </div>
    }

    <!-- Botão -->
    <div class="px-10">
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-[50px] transition-all
          cursor-pointer">
            Entrar
        </button>
    </div>

    <div class="px-10">
        <button class="w-full flex items-center justify-center gap-3 py-3 border border-gray-300 rounded-[50px] bg-white
            shadow-[0px_18px_30px_rgba(131,119,198,0.11)]
            hover:shadow-[0px_22px_40px_rgba(131,119,198,0.18)]
            hover:-translate-y-1
            hover:bg-gray-50
            transition-all duration-300
            cursor-pointer">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            <span class="text-[#1D1C2B] font-medium">Entrar com o Google</span>
        </button>
    </div>

</form>
