<!-- PAGINA 1 -->
<div class="flex flex-col gap-12.5">
    <div class="flex justify-center gap-20 ">
        <!-- PROFISSIONAIS -->
        <div class="w-65 h-60 p-10 bg-[#FFFFFF] cursor-pointer hover:scale-108
         transition rounded-2xl shadow-[0px_4px_4px_rgba(0,0,0,0.25)]
         flex flex-col items-center justify-center" [class.border-[#143886]]="profissional === 1"
            [class.scale-108]="profissional === 1" [class.shadow-lg]="profissional === null || profissional === 2"
            (click)="selecionarProfissional()">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-24 h-24 text-[#21C694]">
                <path
                    d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762" />
            </svg>

            <p class="font-light text-[#020035] text-[28px] text-center">
                Sou um <b class="font-semibold">profissional</b>
            </p>
        </div>

        <!-- INSTITUICOES -->
        <div class="w-65 h-60 p-10  bg-[#FFFFFF] cursor-pointer 
        hover:scale-108
         transition rounded-2xl shadow-[0px_4px_4px_rgba(0,0,0,0.25)]
         flex flex-col items-center justify-center" [class.border-[#143886]]="profissional === 2"
            [class.scale-108]="profissional === 2" [class.shadow-lg]="profissional === null || profissional === 1"
            (click)="selecionarInstituicao()">

            <svg class="w-24 h-24 text-[#21C694]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                <path fill="currentColor"
                    d="M248,208h-8V128a16,16,0,0,0-16-16H168V48a16,16,0,0,0-16-16H56A16,16,0,0,0,40,48V208H32a8,8,0,0,0,0,16H248a8,8,0,0,0,0-16Zm-120,0H80V160h48Zm0-104H112v16a8,8,8,0,1-16,0V104H80a8,8,0,0,1,0-16H96V72a8,8,0,0,1,16,0V88h16a8,8,0,0,1,0,16Zm96,104H168V128h56Z" />
            </svg>

            <p class="font-light text-[#020035] text-[28px] text-center">
                Sou uma <b class="font-semibold">instituição</b>
            </p>
        </div>
    </div>

    <div class="flex flex-col items-center gap-2">

        <!-- BOTAO -->
        <div class="px-10 w-full">
            <button (click)="proximo()" type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-[50px] transition-all cursor-pointer">
                Confirmar
            </button>
        </div>

        <!-- CONTA -->
        <a href="/login" class="text-[#8C8C8C] hover:text-[#2D69FF] hover:underline text-sm">
            Já possuo uma conta
        </a>

        @if (erroCadastro) {
            <p class="text-red-500 font-medium text-sm mt-2">
                {{ erroCadastro }}
            </p>
        }

    </div>

    <div class="mb-8 flex items-center gap-4">
        <div class="h-2 w-1/2 rounded-full bg-[#020035]"></div>
        <div class="h-2 w-1/2 rounded-full bg-gray-300"></div>
        <div class="h-2 w-1/2 rounded-full bg-gray-300"></div>
    </div>
</div>
