<p-card class="bg-white! rounded-2xl! shadow-sm! w-104.5
         [&_.p-card-content]:p-0!
         [&_.p-card-body]:p-0! pb-1">

    <div class="flex items-center gap-3 px-4 pt-5">
        <span class="w-8 h-8 flex items-center justify-center" [innerHTML]="iconHtml"></span>
        <h2 class="text-xl font-bold text-[#0b1a4b]">Profissionais alocados</h2>
    </div>

    <div class="h-px bg-gray-300 mx-4 my-3"></div>

    <div class="flex items-center gap-6 px-4">

        <div class="w-35 flex justify-center">
            <app-pie-chart [alocadosPath]="alocadosPath" [naoAlocadosPath]="naoAlocadosPath"
                [dividerAngleRad]="dividerAngleRad" [dividerX]="dividerX" [dividerY]="dividerY"
                [dividerColor]="dividerColor">
            </app-pie-chart>
        </div>

        <app-pie-legend [percentAlocados]="percentAlocados" [percentNaoAlocados]="percentNaoAlocados">
        </app-pie-legend>

    </div>

</p-card>
