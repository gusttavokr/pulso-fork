    <p class="text-3xl font-bold text-[#020035]">Plantões abertos</p>

<!-- Guarda filtros e lista de plantões -->
<div class="flex gap-6 items-start h-full max-w-300 mr-4">
    <div class="flex-1">

        <app-pesquisa></app-pesquisa>
        <!-- Lista de plantoes -->
        <div class="flex flex-col gap-5 min-h-[70vh] mb-10">
            @if (plantoes().length === 0) {
            <div class="flex flex-col justify-center items-center text-center flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24" fill="none"
                    stroke="#848484" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-frown-icon lucide-frown">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M16 16s-1.5-2-4-2-4 2-4 2" />
                    <line x1="9" x2="9.01" y1="9" y2="9" />
                    <line x1="15" x2="15.01" y1="9" y2="9" />
                </svg>
                <p class="text-gray-500 mt-2">Nenhum plantão encontrado.</p>
            </div>
            } @else {
            @for (plantao of plantoes(); track $index) {
            <app-card-plantao [plantao]="plantao"
                [contexto]="plantaoVisualizacaoContexto.PLANTOES_ABERTOS"></app-card-plantao>
            }
            }
        </div>
    </div>

    <!-- Filtros -->
    <app-filtros [contexto]="filtroContexto.PLANTOES_ABERTOS"
        (plantoesFiltrados)="onFiltrosAplicados($event)"></app-filtros>
</div>
