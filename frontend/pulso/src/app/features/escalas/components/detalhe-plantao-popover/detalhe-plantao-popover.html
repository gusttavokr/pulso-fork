<div class="fixed inset-0 z-40" (click)="handleClose()"></div>

<div class="fixed z-50 bg-white rounded-lg shadow-xl px-4 py-3 w-110" [style.left.px]="position.x"
    [style.top.px]="position.y" (click)="$event.stopPropagation()">

                <defs>
                    <clipPath id="clip0_559_1245">
                        <rect width="48" height="48" fill="white" />
                    </clipPath>
                </defs>
            </svg>
            <h2 class="text-md font-semibold">{{ shift.nomeInstituicao }}</h2>
        </div>

        <div class="transition-transform hover:scale-110 cursor-pointer">
            <svg width="29" height="29" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">

                    fill="#FF4141" />
            </svg>
        </div>

    </div>

    <div class="flex items-center pt-3">

        <div class="flex-1">
            <div class="flex items-center gap-1.5">
                <div [innerHTML]="iconeEspecialidade()"></div>
                <p class="text-md">{{ labelEspecialidade() }}</p>
            </div>

            <div class="flex items-center gap-3 ml-1 pt-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" [attr.fill]="status().color"
                    viewBox="0 0 256 256">
                    <path
                        d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM169.66,133.66l-48,48a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L116,164.69l42.34-42.35a8,8,0,0,1,11.32,11.32ZM48,80V48H72v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80Z" />
                </svg>
                <p class="text-md">{{ status().label }}</p>
            </div>
        </div>

        <div>
            <div class="text-md h-8">
                <span class="font-bold">Horário:</span>
                {{ shift.horaEntrada | date:'HH:mm' }} -
                {{ shift.horaSaida | date:'HH:mm' }}
                <span class="text-[#21C694] font-bold">
                    (+{{ duracaoHoras() }}h)
                </span>
            </div>

            <div class="text-md font-bold text-[#21C694] h-8 pt-3">
                {{ shift.estimativaValor | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
            </div>

        </div>

    </div>

    <div class="flex justify-end mt-2">
        <app-button (click)="handleViewDetails()" label="Detalhar" variant="confirmacao" [svgIcon]="svg"
            [iconSize]="26" />
    </div>
</div>
