<div class="rounded-xl bg-white shadow-md p-8 hover:shadow-lg transition">
    <div class="pb-2 border-b border-gray-300 flex justify-between">
        <div class="flex items-center gap-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#2d69ff" viewBox="0 0 256 256">
                <path
                    d="M224,71.1a8,8,0,0,1-10.78-3.42,94.13,94.13,0,0,0-33.46-36.91,8,8,0,1,1,8.54-13.54,111.46,111.46,0,0,1,39.12,43.09A8,8,0,0,1,224,71.1ZM35.71,72a8,8,0,0,0,7.1-4.32A94.13,94.13,0,0,1,76.27,30.77a8,8,0,1,0-8.54-13.54A111.46,111.46,0,0,0,28.61,60.32,8,8,0,0,0,35.71,72Zm186.1,103.94A16,16,0,0,1,208,200H167.2a40,40,0,0,1-78.4,0H48a16,16,0,0,1-13.79-24.06C43.22,160.39,48,138.28,48,112a80,80,0,0,1,160,0C208,138.27,212.78,160.38,221.81,175.94ZM150.62,200H105.38a24,24,0,0,0,45.24,0Z">
                </path>
            </svg>
            <h1 class="text-2xl font-semibold text-[#020035]">#{{ escala.id }} - {{ escala.nome }}</h1>
        </div>

        <button (click)="abrirConfirmacao()"
            class="bg-transparent border-0 p-0 cursor-pointer transform transition-transform duration-200 hover:scale-125">
            <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M27 6H22V5C22 4.20435 21.6839 3.44129 21.1213 2.87868C20.5587 2.31607 19.7956 2 19 2H13C12.2044 2 11.4413 2.31607 10.8787 2.87868C10.3161 3.44129 10 4.20435 10 5V6H5C4.73478 6 4.48043 6.10536 4.29289 6.29289C4.10536 6.48043 4 6.73478 4 7C4 7.26522 4.10536 7.51957 4.29289 7.70711C4.48043 7.89464 4.73478 8 5 8H6V26C6 26.5304 6.21071 27.0391 6.58579 27.4142C6.96086 27.7893 7.46957 28 8 28H24C24.5304 28 25.0391 27.7893 25.4142 27.4142C25.7893 27.0391 26 26.5304 26 26V8H27C27.2652 8 27.5196 7.89464 27.7071 7.70711C27.8946 7.51957 28 7.26522 28 7C28 6.73478 27.8946 6.48043 27.7071 6.29289C27.5196 6.10536 27.2652 6 27 6ZM14 21C14 21.2652 13.8946 21.5196 13.7071 21.7071C13.5196 21.8946 13.2652 22 13 22C12.7348 22 12.4804 21.8946 12.2929 21.7071C12.1054 21.5196 12 21.2652 12 21V13C12 12.7348 12.1054 12.4804 12.2929 12.2929C12.4804 12.1054 12.7348 12 13 12C13.2652 12 13.5196 12.1054 13.7071 12.2929C13.8946 12.4804 14 12.7348 14 13V21ZM20 21C20 21.2652 19.8946 21.5196 19.7071 21.7071C19.5196 21.8946 19.2652 22 19 22C18.7348 22 18.4804 21.8946 18.2929 21.7071C18.1054 21.5196 18 21.2652 18 21V13C18 12.7348 18.1054 12.4804 18.2929 12.2929C18.4804 12.1054 18.7348 12 19 12C19.2652 12 19.5196 12.1054 19.7071 12.2929C19.8946 12.4804 20 12.7348 20 13V21ZM20 6H12V5C12 4.73478 12.1054 4.48043 12.2929 4.29289C12.4804 4.10536 12.7348 4 13 4H19C19.2652 4 19.5196 4.10536 19.7071 4.29289C19.8946 4.48043 20 4.73478 20 5V6Z"
                    fill="#FF4141" />
            </svg>
        </button>
    </div>

    <div class="flex justify-between items-stretch pt-3">
        <div class="flex flex-col gap-3">
            <div class="flex flex-wrap items-center gap-5">
                <img [src]="escala.fotoLider" alt="Foto do líder"
                    class="w-10 h-10 rounded-full object-cover border-3 border-[#2D69FF]" />

                <p class="text-[#020035]">
                    <span class="font-bold">Líder:</span>
                    {{ escala.nomeLider }}
                </p>
            </div>

            <div class="text-[#020035]">
                <p>
                    <span class="font-bold">Data de criação:</span>
                    {{ escala.dataCriacao | date:'dd/MM/yyyy' }}
                </p>

                <p>
                    <span class="font-bold">Data de atualização:</span>
                    {{ escala.dataAtualizacao | date:'dd/MM/yyyy' }}
                </p>
            </div>
        </div>

        <div class="flex flex-col justify-between items-end gap-3 text-right">
            <div class="flex items-center gap-2">
                <span [innerHTML]="iconeStatus"></span>
                <p [style.color]="statusCor">
                    {{ statusLabel }}
                </p>
            </div>

            <div class="flex justify-end">
                <app-button (click)="abrirDetalhe()" class="mt-4" label="Detalhar" variant="confirmacao" [svgIcon]="svg"
                    [iconSize]="26"></app-button>
            </div>
        </div>
    </div>
</div>

<app-confirm-modal [visible]="showConfirm()" (closed)="cancelarRemocao()" (cancelled)="cancelarRemocao()"
    (confirmed)="confirmarRemocao()" title="Confirmar exclusão"
    [message]="'Tem certeza que deseja excluir a escala ' + escala.nome + '?'">
</app-confirm-modal>
