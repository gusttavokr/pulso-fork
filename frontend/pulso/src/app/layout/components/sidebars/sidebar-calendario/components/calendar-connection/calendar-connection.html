<div class="mb-6">

    @if (isConnected) {

    <div class="bg-white/30 backdrop-blur-sm rounded-lg p-3 border border-white/20 transition-all duration-300">
        <div class="flex items-center gap-2 text-white">
            <svg class="w-7 h-7 shrink-0" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="white"
                    d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z" />
                <path fill="white"
                    d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z" />
                <path fill="white"
                    d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z" />
                <path fill="white"
                    d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z" />
            </svg>
            <span class="text-sm font-medium">
                Conectado ao Google Agenda
            </span>
        </div>
    </div>

    } @else {

    <button (click)="connect.emit()"
        class="w-full flex items-center justify-center gap-3 bg-white text-[#2D69FF] px-4 py-3 rounded-lg hover:bg-gray-50 transition-all duration-200 font-semibold shadow-md hover:shadow-lg transform hover:scale-[1.02]">
        <i class="fab fa-google text-xl"></i>
        Conectar Google Calendar
    </button>

    }

</div>
