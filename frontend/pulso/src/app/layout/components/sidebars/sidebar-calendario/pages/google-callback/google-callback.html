@if (isProcessing()) {
<div class="fixed inset-0 bg-black/30 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-[#F6F8FE] rounded-xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-[#2D69FF] mx-auto mb-4"></div>

            <h2 class="text-xl font-semibold text-[#020035]">
                Conectando ao Google Calendar...
            </h2>

            <p class="text-[#A3A3A3] mt-2">
                Por favor, aguarde.
            </p>
        </div>
    </div>
</div>
} @else {
    <app-feedback-modal [visible]="!success()" type="error" modalTitle="Erro ao conectar" [message]="error() ?? ''" buttonLabel="Voltar"
        (closed)="goHome()">
    </app-feedback-modal>
    
    <app-feedback-modal [visible]="success()" type="success" modalTitle="Sucesso!" message="Google Calendar conectado com sucesso."
        subMessage="Você será redirecionado automaticamente.">
    </app-feedback-modal>
}
