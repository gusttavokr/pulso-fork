<div class="relative w-full">

    <div [class]="sidebarService.sidebarAberta()
      ? 'fixed top-1/2 right-87.5 transform -translate-y-1/2 z-10 transition-all duration-500 ease-in-out'
      : 'fixed top-1/2 right-0 transform -translate-y-1/2 z-10 transition-all duration-500 ease-in-out'">
        <button (click)="inverterSidebar()"
            class="p-2 rounded-l-lg bg-white hover:bg-gray-100 transition-colors cursor-pointer shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" [class.rotate-180]="sidebarService.sidebarAberta()" width="32" height="32"
                viewBox="0 0 24 24" fill="none" stroke="#020035" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-chevron-left-icon lucide-chevron-left transition-transform duration-300 ease-in-out">
                <path d="m15 18-6-6 6-6" />
            </svg>
        </button>
    </div>

    <div class="fixed top-0 right-0 h-screen w-87.5 bg-[#2D69FF] px-7.5 py-11.5
           overflow-y-auto z-0 shadow-lg transform transition-transform duration-500 ease-in-out"
        [class.translate-x-full]="!sidebarService.sidebarAberta()">

        <section class="secao-calendario">

            <h2
                class="flex items-center justify-center text-2xl font-inter font-bold text-white mb-6 pb-3 border-b border-white/20">

                        <clipPath id="clip0_1270_1466">
                            <rect width="32" height="32" fill="white" />

                </svg>
                Calendário
            </h2>

            <app-calendar-connection [isConnected]="isConnected()" (connect)="connectGoogleCalendar()"
                (disconnect)="disconnectGoogleCalendar()">
            </app-calendar-connection>

            @if (isLoading()) {

            <div class="flex flex-col justify-center items-center py-10">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white mb-3"></div>
                <p class="text-white text-sm">
                    Carregando eventos...
                </p>
            </div>

            }

            @else if (grupos.length === 0) {
            <div class="flex flex-col items-center justify-center py-10 text-white">
                <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>
                </svg>
                <p class="text-center text-sm">Nenhum evento encontrado</p>
            </div>
            }

            @else {

            @for (grupo of grupos; track $index) {

            <app-calendar-event-group [data]="grupo.data" [itens]="grupo.itens">
            </app-calendar-event-group>

            }

            @if (isConnected()) {
            <app-button variant="excluir" label="Desconectar google agenda" [svgIcon]="svg" [iconSize]="26"
                (click)="disconnectGoogleCalendar()"></app-button>
            }

            }

        </section>

    </div>

</div>
