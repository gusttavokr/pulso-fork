<div class="py-2">
    <div class="flex justify-between items-center select-none mb-2">
        <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                style="color: #2D69FF">
                <path
                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            <p class="font-normal text-[#020035]">Visualização</p>
        </div>
    </div>

    <div class="flex flex-col gap-3 transition-all duration-500 ease-in-out mt-2">
        @for (tipo of tipos; track tipo) {
        <button class="w-full flex items-center gap-3 px-4 py-2 rounded-xl border transition-all" [ngClass]="
                        visualizacao() === tipo
                        ? 'bg-[#EEF3FF] border-[#2D69FF] text-[#2D69FF]'
                        : 'bg-white border-[#E0E0E0] text-[#8A8AA3] hover:bg-[#F6F8FE] hover:text-[#2D69FF]'
                    " (click)="selecionar(tipo)">

            <span class="flex items-center gap-2">
                <ng-container [ngSwitch]="tipo">

                    <svg *ngSwitchCase="'LIDER_ESCALA'" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                        <rect width="20" height="14" x="2" y="6" rx="2" />
                    </svg>

                    <svg *ngSwitchCase="'PROFISSIONAL'" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 256 256" fill="currentColor">
                        <path
                            d="M220,160a12,12,0,1,1-12-12A12,12,0,0,1,220,160Zm-4.55,39.29A48.08,48.08,0,0,1,168,240H144a48.05,48.05,0,0,1-48-48V151.49A64,64,0,0,1,40,88V40a8,8,0,0,1,8-8H72a8,8,0,0,1,0,16H56V88a48,48,0,0,0,48.64,48c26.11-.34,47.36-22.25,47.36-48.83V48H136a8,8,0,0,1,0-16h24a8,8,0,0,1,8,8V87.17c0,32.84-24.53,60.29-56,64.31V192a32,32,0,0,0,32,32h24a32.06,32.06,0,0,0,31.22-25,40,40,0,1,1,16.23.27ZM232,160a24,24,0,1,0-24,24A24,24,0,0,0,232,160Z" />
                    </svg>

                </ng-container>
            </span>

            <span class="text-sm font-medium whitespace-nowrap">
                {{ getLabel(tipo) }}
            </span>
        </button>
        }
    </div>
</div>
