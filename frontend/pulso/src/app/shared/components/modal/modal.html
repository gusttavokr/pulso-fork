@if (visible) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
    (click)="onBackdropClick($event)">

    <div class="relative bg-[#F6F8FE] rounded-xl shadow-2xl mx-auto w-full modal-enter" [style.max-width]="getWidth()"
        [class.p-8]="!noPadding">

        <!-- Botão fechar -->
        @if (showCloseButton) {
        <button (click)="fechar()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center
                   rounded-full bg-transparent hover:bg-[#020035]/10
                   transition-all duration-200 group cursor-pointer" aria-label="Fechar">
            <svg class="w-5 h-5 text-[#A3A3A3] group-hover:text-[#020035] transition-colors duration-200" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        }

        <!-- HEADER -->
        <ng-content select="[modal-header]" />

        <!-- BODY -->
        <ng-content select="[modal-body]" />

        <!-- FOOTER -->
        <ng-content select="[modal-footer]" />

        <!-- FALLBACK -->
        <ng-content />

    </div>
</div>
}
