services:
  db:
    image: postgres:17
    container_name: pulso_db
    environment:
      POSTGRES_USER: pulso_user
      POSTGRES_PASSWORD: pulso_password
      POSTGRES_DB: pulso_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7
    container_name: pulso_redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      
  api:
    image: pulsoifrn/pulso-backend:latest
    container_name: pulso_api
    env_file:
      - .env
    ports:
      - "8080"
    depends_on:
      - db
      - redis
    restart: on-failure
    
  web:
    image: pulsoifrn/pulso-frontend:latest
    container_name: app_frontend
    ports:
      - "80"
    volumes:
      - /home/ubuntu/ssl:/etc/nginx/ssl:ro

  nginx:
    image: nginx:alpine
    container_name: pulso_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      
volumes:
  db_data:
  redis_data:
