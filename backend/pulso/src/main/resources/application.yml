spring:
  application:
    name: pulso

  datasource:
    url: jdbc:postgresql://db:5432/pulso_db
    username: pulso_user
    password: pulso_password
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  data:
    redis:
      host: redis
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms

# Swagger/OpenAPI configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  # packages-to-scan: web.pulso.controller

# Autenticação
jwt:
  private:
    key: "classpath:app.key"
  public:
    key: "classpath:app.pub"

# contas
account:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    
openapi:
  server-url: ${OPENAPI_SERVER_URL:http://localhost:8080}

# Google OAuth2 Configuration
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:your-client-id-here}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:your-client-secret-here}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:4200/google-callback}

server:
  forward-headers-strategy: native
  tomcat:
    accesslog:
      enabled=false:

logging:
  level:
    org.springframework.web.socket: warn
    org.springframework.web.socket.messaging: warn